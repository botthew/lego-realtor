<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=800, height=1000">
    <title>The DMV First-Time Buyer Blueprint</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            width: 800px;
            height: 1000px;
            overflow: hidden;
        }
        .cover {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            flex-direction: column;
            padding: 40px;
            position: relative;
        }
        .lego-pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: 
                radial-gradient(circle at 20% 80%, rgba(255, 71, 87, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(255, 193, 7, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            z-index: 1;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-brick {
            width: 40px;
            height: 40px;
            background: #FF4747;
            border-radius: 4px;
            position: relative;
        }
        .logo-brick::before {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 8px;
            background: #FF4747;
            border-radius: 2px;
            box-shadow: 14px 0 0 #FF4747, 28px 0 0 #FF4747;
        }
        .logo-text {
            color: #FFC107;
            font-weight: bold;
            font-size: 18px;
        }
        .badge {
            background: #FFC107;
            color: #1a1a2e;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 1;
        }
        .icon-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        .lego-stack {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .brick {
            width: 50px;
            height: 20px;
            border-radius: 4px;
            position: relative;
        }
        .brick::before {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            width: 10px;
            height: 8px;
            background: inherit;
            border-radius: 2px;
        }
        .brick-red { background: #FF4747; }
        .brick-yellow { background: #FFC107; }
        .brick-blue { background: #4D96FF; }
        .brick-green { background: #6BCB77; }
        
        .title {
            color: white;
            font-size: 48px;
            font-weight: bold;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .title span {
            color: #FFC107;
        }
        .subtitle {
            color: #a0a0b0;
            font-size: 20px;
            text-align: center;
            margin-bottom: 40px;
        }
        .steps-preview {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 30px;
        }
        .steps-title {
            color: #FFC107;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-align: center;
        }
        .steps-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }
        .step {
            text-align: center;
            padding: 15px 10px;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            transition: transform 0.3s ease;
        }
        .step:hover {
            transform: translateY(-5px);
        }
        .step-num {
            width: 36px;
            height: 36px;
            background: #FF4747;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin: 0 auto 10px;
            font-size: 16px;
        }
        .step-label {
            color: white;
            font-size: 12px;
        }
        .footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            z-index: 1;
        }
        .cta-button {
            background: linear-gradient(135deg, #FFC107 0%, #FFD54F 100%);
            color: #1a1a2e;
            padding: 16px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 193, 7, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(255, 193, 7, 0.4);
        }
        .features {
            display: flex;
            gap: 30px;
            color: #a0a0b0;
            font-size: 13px;
        }
        .feature {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .feature-icon {
            width: 20px;
            height: 20px;
            background: #6BCB77;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }
        .decoration {
            position: absolute;
            opacity: 0.15;
        }
        .dec-1 {
            top: 100px;
            right: -50px;
            width: 150px;
            height: 150px;
            background: #FFC107;
            border-radius: 20px;
            transform: rotate(45deg);
        }
        .dec-2 {
            bottom: 150px;
            left: -30px;
            width: 100px;
            height: 100px;
            background: #FF4747;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="cover">
        <div class="lego-pattern"></div>
        <div class="decoration dec-1"></div>
        <div class="decoration dec-2"></div>
        
        <div class="header">
            <div class="logo">
                <div class="logo-brick"></div>
                <span class="logo-text">LEGO REALTOR</span>
            </div>
            <span class="badge">FREE GUIDE</span>
        </div>
        
        <div class="main-content">
            <div class="icon-row">
                <div class="lego-stack">
                    <div class="brick brick-red"></div>
                    <div class="brick brick-red"></div>
                </div>
                <div class="lego-stack">
                    <div class="brick brick-yellow"></div>
                    <div class="brick brick-yellow"></div>
                    <div class="brick brick-yellow"></div>
                </div>
                <div class="lego-stack">
                    <div class="brick brick-blue"></div>
                    <div class="brick brick-blue"></div>
                </div>
                <div class="lego-stack">
                    <div class="brick brick-green"></div>
                    <div class="brick brick-green"></div>
                    <div class="brick brick-green"></div>
                </div>
            </div>
            
            <h1 class="title">The DMV <span>First-Time</span><br>Buyer Blueprint</h1>
            <p class="subtitle">Your step-by-step roadmap to homeownership in DC, MD & VA</p>
            
            <div class="steps-preview">
                <div class="steps-title">What's Inside</div>
                <div class="steps-grid">
                    <div class="step">
                        <div class="step-num">1</div>
                        <div class="step-label">Get Pre-Approved</div>
                    </div>
                    <div class="step">
                        <div class="step-num">2</div>
                        <div class="step-label">Find Your Home</div>
                    </div>
                    <div class="step">
                        <div class="step-num">3</div>
                        <div class="step-label">Make an Offer</div>
                    </div>
                    <div class="step">
                        <div class="step-num">4</div>
                        <div class="step-label">Close & Win</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="footer">
            <div class="features">
                <div class="feature">
                    <div class="feature-icon">✓</div>
                    <span>28-page guide</span>
                </div>
                <div class="feature">
                    <div class="feature-icon">✓</div>
                    <span>Checklists included</span>
                </div>
                <div class="feature">
                    <div class="feature-icon">✓</div>
                    <span>Expert tips</span>
                </div>
            </div>
            <button class="cta-button">Download Free</button>
        </div>
    </div>
</body>
</html>
